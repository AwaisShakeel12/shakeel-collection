<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">MyStore Admin</a>
            <a href="/" class="btn btn-outline-light btn-sm">Back to Store</a>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 700px;">
        <h2 class="mb-4 text-center">Upload New Product</h2>
        
        <div class="card shadow">
            <div class="card-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Admin Security Key</label>
                        <input type="password" class="form-control" id="adminKey" value="dev-upload-key-change-me" required>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="category" required>
                            <option value="1">Jewelry</option>
                            <option value="2">Clothing</option>
                            <option value="3">Other Top Items</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Product Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" step="0.01" class="form-control" id="price" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Discount Price <small class="text-muted">(Optional)</small></label>
                            <input type="number" step="0.01" class="form-control" id="discount_price">
                        </div>
                    </div>
                    
                    <div class="card bg-light p-3 mb-3">
                        <label class="form-label fw-bold">Image Source (Choose One)</label>
                        <div class="mb-3">
                            <label class="form-label">Upload from Computer</label>
                            <input type="file" class="form-control" id="image_file" accept="image/*">
                        </div>
                        <div class="text-center text-muted mb-2">OR</div>
                        <div class="mb-0">
                            <label class="form-label">Paste Pinterest / External Link</label>
                            <input type="url" class="form-control" id="image_url" placeholder="https://...">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_featured">
                                <label class="form-check-label" for="is_featured">Featured on Home Page</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_sold">
                                <label class="form-check-label" for="is_sold">Mark as Sold</label>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">Upload Product</button>
                    <div id="message" class="mt-3 text-center"></div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true;
            btn.innerText = 'Uploading...';
            msgDiv.innerHTML = '';

            const formData = new FormData();
            formData.append('admin_key', document.getElementById('adminKey').value);
            formData.append('name', document.getElementById('name').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('price', document.getElementById('price').value);
            
            const discPrice = document.getElementById('discount_price').value;
            if(discPrice) formData.append('discount_price', discPrice);
            
            const imgFile = document.getElementById('image_file').files[0];
            if(imgFile) formData.append('image_file', imgFile);
            
            const imgUrl = document.getElementById('image_url').value;
            if(imgUrl) formData.append('image_url', imgUrl);
            
            if(document.getElementById('is_featured').checked) formData.append('is_featured', 'on');
            if(document.getElementById('is_sold').checked) formData.append('is_sold', 'on');

            try {
                // Send to FastAPI proxy
                const response = await fetch('/admin/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (response.ok && result.id) {
                    msgDiv.innerHTML = '<div class="alert alert-success">Product uploaded successfully!</div>';
                    document.getElementById('uploadForm').reset();
                } else {
                    msgDiv.innerHTML = `<div class="alert alert-danger">Error: ${JSON.stringify(result)}</div>`;
                }
            } catch (error) {
                msgDiv.innerHTML = `<div class="alert alert-danger">Network Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Upload Product';
            }
        });
    </script>
</body>
</html>
