<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - NS Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .admin-card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .product-row { transition: all 0.3s; }
        .product-row:hover { background: #f8f9fa; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-arrow-left"></i> NS Collection</a>
            <span class="navbar-text text-white"><i class="bi bi-shield-lock"></i> Admin Dashboard</span>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="mb-3"><i class="bi bi-speedometer2"></i> Admin Dashboard</h1>
                <p class="text-muted">Manage your products, categories, and store settings.</p>
            </div>
        </div>

        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="upload-tab" data-bs-toggle="tab" data-bs-target="#upload" type="button">
                    <i class="bi bi-plus-circle"></i> Upload Product
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button" onclick="loadProducts()">
                    <i class="bi bi-list-ul"></i> Manage Products
                </button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabContent">
            <!-- Upload Product Tab -->
            <div class="tab-pane fade show active" id="upload" role="tabpanel">
                <div class="card admin-card">
                    <div class="card-body">
                        <h4 class="card-title mb-4"><i class="bi bi-cloud-upload"></i> Upload New Product</h4>
                        <form id="uploadForm">
                            <!-- NO ADMIN KEY FIELD HERE ANYMORE -->
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="1">Jewelry</option>
                                    <option value="2">Clothing</option>
                                    <option value="3">Other Top Items</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Price</label>
                                    <input type="number" step="0.01" class="form-control" id="price" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Discount Price <small class="text-muted">(Optional)</small></label>
                                    <input type="number" step="0.01" class="form-control" id="discount_price">
                                </div>
                            </div>
                            <div class="card bg-light p-3 mb-3">
                                <label class="form-label fw-bold">Image Source (Choose One)</label>
                                <div class="mb-3">
                                    <label class="form-label">Upload from Computer</label>
                                    <input type="file" class="form-control" id="image_file" accept="image/*">
                                </div>
                                <div class="text-center text-muted mb-2">OR</div>
                                <div class="mb-0">
                                    <label class="form-label">Paste Pinterest / External Link</label>
                                    <input type="url" class="form-control" id="image_url" placeholder="https://...">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="is_featured">
                                        <label class="form-check-label" for="is_featured">Featured on Home Page</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="is_sold">
                                        <label class="form-check-label" for="is_sold">Mark as Sold</label>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100" id="submitBtn">
                                <i class="bi bi-upload"></i> Upload Product
                            </button>
                            <div id="message" class="mt-3 text-center"></div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Manage Products Tab -->
            <div class="tab-pane fade" id="products" role="tabpanel">
                <div class="card admin-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h4 class="card-title mb-0"><i class="bi bi-box-seam"></i> All Products</h4>
                            <button class="btn btn-sm btn-outline-primary" onclick="loadProducts()">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Price</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="productsTable">
                                    <tr><td colspan="6" class="text-center py-4 text-muted">Click the "Manage Products" tab or Refresh to load items.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div class="modal fade" id="editModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editForm">
                            <input type="hidden" id="edit_product_id">
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="edit_category" required>
                                    <option value="1">Jewelry</option>
                                    <option value="2">Clothing</option>
                                    <option value="3">Other Top Items</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="edit_name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" id="edit_description" rows="3"></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Price</label>
                                    <input type="number" step="0.01" class="form-control" id="edit_price" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Discount Price</label>
                                    <input type="number" step="0.01" class="form-control" id="edit_discount_price">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Image URL (Optional)</label>
                                <input type="url" class="form-control" id="edit_image_url" placeholder="https://...">
                            </div>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="edit_is_featured">
                                        <label class="form-check-label" for="edit_is_featured">Featured on Home Page</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="edit_is_sold">
                                        <label class="form-check-label" for="edit_is_sold">Mark as Sold</label>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="saveEdit()">
                            <i class="bi bi-check-circle"></i> Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadProducts() {
            fetch('/api/admin/products')
                .then(res => res.json())
                .then(products => {
                    const tbody = document.getElementById('productsTable');
                    if (!products || products.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No products found.</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = products.map(p => `
                        <tr class="product-row">
                            <td><img src="${p.image || 'https://via.placeholder.com/60'}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;" alt="${p.name}"></td>
                            <td><strong>${p.name}</strong></td>
                            <td>${p.category_name}</td>
                            <td>${p.discount_price ? `<s class="text-muted">${p.original_price}</s> <span class="text-danger fw-bold">${p.display_price}</span>` : `<span class="fw-bold">${p.display_price}</span>`}</td>
                            <td>
                                ${p.is_sold ? '<span class="badge bg-danger">Sold</span>' : '<span class="badge bg-success">Available</span>'}
                                ${p.is_featured ? '<span class="badge bg-primary ms-1">Featured</span>' : ''}
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="editProduct(${p.id})"><i class="bi bi-pencil"></i> Edit</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}')"><i class="bi bi-trash"></i> Delete</button>
                            </td>
                        </tr>
                    `).join('');
                })
                .catch(err => {
                    document.getElementById('productsTable').innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Error loading products</td></tr>';
                });
        }

        function editProduct(id) {
            fetch('/api/admin/products')
                .then(res => res.json())
                .then(products => {
                    const product = products.find(p => p.id === id);
                    if (!product) return;
                    
                    document.getElementById('edit_product_id').value = product.id;
                    document.getElementById('edit_category').value = product.category;
                    document.getElementById('edit_name').value = product.name;
                    document.getElementById('edit_description').value = product.description || '';
                    document.getElementById('edit_price').value = product.original_price;
                    document.getElementById('edit_discount_price').value = product.discount_price || '';
                    document.getElementById('edit_image_url').value = product.image && product.image.startsWith('http') ? product.image : '';
                    document.getElementById('edit_is_featured').checked = product.is_featured;
                    document.getElementById('edit_is_sold').checked = product.is_sold;
                    
                    const modal = new bootstrap.Modal(document.getElementById('editModal'));
                    modal.show();
                });
        }

        function saveEdit() {
            const id = document.getElementById('edit_product_id').value;
            const data = {
                category: document.getElementById('edit_category').value,
                name: document.getElementById('edit_name').value,
                description: document.getElementById('edit_description').value,
                price: document.getElementById('edit_price').value,
                is_featured: document.getElementById('edit_is_featured').checked,
                is_sold: document.getElementById('edit_is_sold').checked
            };
            const discountPrice = document.getElementById('edit_discount_price').value;
            if (discountPrice) data.discount_price = discountPrice;
            const imageUrl = document.getElementById('edit_image_url').value;
            if (imageUrl) data.image_url = imageUrl;
            
            fetch(`/api/admin/product/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.id) {
                    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                    loadProducts();
                    alert('Product updated successfully!');
                } else {
                    alert('Error: ' + JSON.stringify(result));
                }
            });
        }

        function deleteProduct(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}"?`)) return;
            fetch(`/api/admin/product/${id}`, { method: 'DELETE' })
            .then(res => {
                if (res.ok) { loadProducts(); alert('Product deleted!'); } 
                else { alert('Error deleting product'); }
            });
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('message');
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerHTML = 'Uploading...'; msgDiv.innerHTML = '';

            const formData = new FormData();
            // NO ADMIN KEY IS SENT ANYMORE
            formData.append('name', document.getElementById('name').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('price', document.getElementById('price').value);
            const discPrice = document.getElementById('discount_price').value;
            if(discPrice) formData.append('discount_price', discPrice);
            const imgFile = document.getElementById('image_file').files[0];
            if(imgFile) formData.append('image_file', imgFile);
            const imgUrl = document.getElementById('image_url').value;
            if(imgUrl) formData.append('image_url', imgUrl);
            if(document.getElementById('is_featured').checked) formData.append('is_featured', 'on');
            if(document.getElementById('is_sold').checked) formData.append('is_sold', 'on');

            try {
                const response = await fetch('/admin/upload', { method: 'POST', body: formData });
                const result = await response.json();
                if (response.ok && result.id) {
                    msgDiv.innerHTML = '<div class="alert alert-success">Product uploaded successfully!</div>';
                    document.getElementById('uploadForm').reset();
                } else {
                    msgDiv.innerHTML = `<div class="alert alert-danger">Error: ${JSON.stringify(result)}</div>`;
                }
            } catch (error) {
                msgDiv.innerHTML = `<div class="alert alert-danger">Network Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="bi bi-upload"></i> Upload Product';
            }
        });
    </script>
</body>
</html>
